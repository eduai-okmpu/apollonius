<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apollonius Problem</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#home" aria-label="Apollonius">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="10" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="21" cy="11" r="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="16" cy="22" r="4.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <span data-i18n="brand">Аполлоний</span>
    </a>
    <ol class="stepper" id="stepper" aria-label="Progress">
      <li data-stage="home"><span class="stepper-n">1</span><span data-i18n="stageChoose">Таңдау</span></li>
      <li data-stage="case"><span class="stepper-n">2</span><span data-i18n="stageCases">Жағдайлар</span></li>
      <li data-stage="build"><span class="stepper-n">3</span><span data-i18n="stageBuild">Салу</span></li>
    </ol>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-kz" data-lang="kz">Қаз</button>
      <button type="button" id="lang-en" data-lang="en">Eng</button>
    </div>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<footer class="foot">
  <div class="foot-inner">
    <span data-i18n="footNote">Пергалық Аполлоний, «Жанасулар туралы», б.з.д. III ғ.</span>
    <span class="mono" data-i18n="footTools">Тек циркуль мен сызғыш</span>
  </div>
</footer>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/geometry.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
